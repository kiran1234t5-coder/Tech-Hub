<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Course Enrollment – Tech Hub</title>

    <style>
        body {
            margin: 0;
            font-family: "Inter", sans-serif;
            background: #0f172a;
            color: #f8fafc;
        }

        .header {
            background: #0b1220;
            color: #fff;
            padding: 28px;
            text-align: center;
            font-size: 30px;
            font-weight: 600;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            background: rgba(255, 255, 255, 0.03);
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            animation: fadeIn 1s ease;
        }

        h2 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 20px;
        }

        label {
            font-size: 16px;
            color: #e2e8f0;
            font-weight: 500;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            margin-top: 5px;
            margin-bottom: 18px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #06b6d4;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: #06b6d4;
            color: #000;
            border-radius: 10px;
            border: none;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #0891b2;
            transform: scale(1.03);
        }

        .payment-box {
            margin-top: 25px;
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 12px;
        }

        .payment-title {
            font-size: 20px;
            color: #38bdf8;
            margin-bottom: 10px;
        }

        .method {
            margin-bottom: 10px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="header">Course Enrollment Form</div>

    <div class="container">

        <h2>Enroll Now</h2>

        <form>

            <label>Full Name</label>
            <input type="text" placeholder="Enter your full name" required>

            <label>Email Address</label>
            <input type="email" placeholder="Enter your email" required>

            <label>Phone Number</label>
            <input type="text" placeholder="03XX-XXXXXXX" required>

            <label>Select Course</label>
            <select required>
                <option value="">-- Select Your Course --</option>
                <option>Web Development</option>
                <option>UI/UX Design</option>
                <option>Digital Marketing & SEO</option>
                <option>Cloud & IT Solutions</option>
                <option>Data Analytics & AI</option>
                <option>Software Solutions & Automation</option>
            </select>

            <label>Additional Notes (optional)</label>
            <textarea rows="3" placeholder="Any message..."></textarea>

            <div class="payment-box">
                <div class="payment-title">Payment Method</div>

                <label class="method">
                    <input type="radio" name="payment" value="easypaisa" required>
                    Easypaisa (Wallet / Bank Transfer)
                </label><br>

                <label class="method">
                    <input type="radio" name="payment" value="jazzcash">
                    JazzCash
                </label><br>

                <label class="method">
                    <input type="radio" name="payment" value="bank">
                    Bank Transfer
                </label><br>

                <label class="method">
                    <input type="radio" name="payment" value="card">
                    Debit / Credit Card
                </label>
            </div>

            <button type="submit" class="btn">Submit Enrollment</button>

        </form>

    </div>

</body>

</html>
